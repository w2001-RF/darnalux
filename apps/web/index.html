<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#06101e" />
    <meta name="description" content="DarnaLux — plateforme de gestion de conciergerie immobilière." />
    <title>DarnaLux Concierge - Votre maison, notre signature</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Raleway:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <script type="text/javascript">
        // Applies the saved theme before first paint (see components/ThemeToggle.tsx).
        (function () {
            try {
                if (localStorage.getItem('darnalux-theme') === 'light') {
                    document.documentElement.dataset.theme = 'light';
                }
            } catch (e) { }
        }());
    </script>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        // Restores the deep link encoded by public/404.html before the app mounts.
        (function (l) {
            if (l.search[1] === '/') {
                // Pin relative asset URLs (Vite base './') to the app root before
                // the address bar is rewritten to the deep link.
                var base = document.createElement('base');
                base.href = l.pathname;
                document.head.appendChild(base);
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location));
    </script>
</head>


<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
