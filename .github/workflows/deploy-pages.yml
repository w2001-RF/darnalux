name: Deploy Web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The repo is pinned to the internal Orange npm proxy, which GitHub-hosted
      # runners cannot reach. For this CI job only, point the runner's copy of
      # the lockfile and .npmrc at the public registry. Integrity hashes are
      # unchanged, so tarballs are still verified. Files in the repo are not modified.
      - name: Use public npm registry (CI only)
        run: |
          sed -i 's#https://repos.tech.orange:443/artifactory/api/npm/npmproxy/#https://registry.npmjs.org/#g' pnpm-lock.yaml
          echo 'registry=https://registry.npmjs.org/' > .npmrc
          if grep -q 'repos.tech.orange' pnpm-lock.yaml; then
            echo 'Lockfile still references the internal registry' >&2
            exit 1
          fi
      # Web + core only: skips Expo / React Native from apps/mobile.
      - run: pnpm install --frozen-lockfile --filter "@darnalux/web..."
      - run: pnpm --filter @darnalux/core test
      # Topological order builds @darnalux/core (dist) before the web app.
      - run: pnpm --filter "@darnalux/web..." build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
